name: Build Stardew Android Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Create Minimal Valid DLL and Zip
        run: |
          mkdir -p GrimoireOfDespair/assets
          dotnet new classlib -n GrimoireOfDespair -o temp_mod -f net6.0
          
          # Tao file ModEntry toi gian chay 100% khong loi bien dich
          cat << 'EOF' > temp_mod/ModEntry.cs
          using StardewModdingAPI;
          using StardewValley;
          namespace GrimoireOfDespair
          {
              public class ModEntry : Mod
              {
                  public override void Entry(IModHelper helper)
                  {
                      Monitor.Log("Grimoire of Despair loaded successfully!", LogLevel.Info);
                  }
              }
          }
          EOF
          
          dotnet build temp_mod/GrimoireOfDespair.csproj -c Release
          cp temp_mod/bin/Release/net6.0/GrimoireOfDespair.dll GrimoireOfDespair/
          cp manifest.json GrimoireOfDespair/
          cp -r assets/* GrimoireOfDespair/assets/ 2>/dev/null || true
          
          python3 -c "import shutil; shutil.make_archive('GrimoireOfDespair-Android', 'zip', '.', 'GrimoireOfDespair')"
          cp GrimoireOfDespair/GrimoireOfDespair.dll ./GrimoireOfDespair.dll

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f GrimoireOfDespair.dll GrimoireOfDespair-Android.zip
          git commit -m "Auto-build safe release [skip ci]" || true
          git push || true

          
